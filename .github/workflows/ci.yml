name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  core:
    # The plugin compiles against a local Archi installation, so CI covers the platform independent engine.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :core:build :core:cliJar -ParchiHome=none
