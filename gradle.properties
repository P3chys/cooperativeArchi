version=1.2.0
# Archi installation used to compile the plugin and run integration tests.
# Override per machine: gradlew build -ParchiHome=/Applications/Archi.app/Contents/Eclipse
archiHome=E:/Archi
# Archi line to build for: 5.4 (Archi 5.4-5.9: Java 17, JGit 6.10) or 5.10 (Archi 5.10+: Java 21, JGit 7)
archiTarget=5.10
org.gradle.caching=true
